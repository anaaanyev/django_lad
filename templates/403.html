{% extends "base.html" %}

{% block title %}Доступ запрещён (403){% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-sm">
                <div class="card-body text-center p-5">
                    <!-- Иконка ошибки -->
                    <div class="display-1 text-danger mb-4">
                        <i class="bi bi-shield-lock"></i> 403
                    </div>

                    <h1 class="h3 mb-3 fw-bold">Доступ запрещён</h1>

                    <p class="text-muted mb-4">
                        У вас недостаточно прав для просмотра этой страницы.
                        Пожалуйста, обратитесь к администратору, если считаете,
                        что это ошибка.
                    </p>

                    <!-- Кнопка возврата на главную -->
                    <a href="{% url 'blog:index_page' %}" class="btn btn-dark btn-lg px-4">
                        <i class="bi bi-arrow-left"></i> На главную
                    </a>
                </div>
            </div>

            <!-- Дополнительная информация -->
            <div class="text-center mt-3">
                <small class="text-muted">
                    Код ошибки: 403 Forbidden
                </small>
            </div>
        </div>
    </div>
{% endblock %}
