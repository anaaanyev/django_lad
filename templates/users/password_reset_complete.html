{% extends 'base.html' %}
{% load static %}

{% block title %}Пароль изменён{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm border-success">
                <div class="card-body p-4 text-center">
                    <div class="mb-3">
                        <i class="bi bi-check-circle" style="font-size: 4rem; color: #28a745;"></i>
                    </div>
                    <h2 class="card-title mb-3">Готово!</h2>
                    <p class="text-muted mb-4">
                        Ваш пароль успешно изменён.<br>
                        Теперь вы можете войти с новыми данными.
                    </p>
                    <a href="{% url 'users:login' %}" class="btn btn-primary btn-lg">
                        Войти
                    </a>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
