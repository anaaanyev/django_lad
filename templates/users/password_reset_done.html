{% extends 'base.html' %}
{% load static %}

{% block title %}Письмо отправлено{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm border-success">
                <div class="card-body p-4 text-center">
                    <div class="mb-3">
                        <i class="bi bi-envelope-check" style="font-size: 4rem; color: #28a745;"></i>
                    </div>
                    <h2 class="card-title mb-3">Проверьте почту</h2>
                    <p class="text-muted mb-4">
                        Мы отправили инструкцию по восстановлению пароля на указанный email.<br>
                        Если письмо не пришло, проверьте папку «Спам».
                    </p>
                    <a href="{% url 'users:login' %}" class="btn btn-outline-primary">
                        Вернуться ко входу
                    </a>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
